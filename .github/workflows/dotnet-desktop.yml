name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET 8
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Ejecutar tests (compila y corre la suite)
      run: dotnet test

    - name: Verificar formato con StyleCop
      run: dotnet format GestorSolicitudes.slnx --verify-no-changes